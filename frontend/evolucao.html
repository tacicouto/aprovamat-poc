<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AprovaMat — Minha evolução</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="tide-bg"></div>

<main class="shell shell--wide">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 18C6 12 9 6 12 6C15 6 15 14 12 14C9 14 9 10 12 10C15 10 18 16 20 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      AprovaMat
    </div>
  </div>

  <span class="eyebrow">Painel de evolução</span>
  <h1 id="tituloEvolucao">Você está indo bem.</h1>
  <p>Aqui está um retrato simples do seu progresso — sem cobrança, só acompanhamento.</p>

  <div id="carregando">
    <div class="skeleton" style="width:100%; height:90px; margin-bottom:20px;"></div>
    <div class="skeleton" style="width:100%; height:70px; margin-bottom:10px;"></div>
    <div class="skeleton" style="width:100%; height:70px;"></div>
  </div>

  <div id="conteudoEvolucao" style="display:none;">
    <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap: var(--space-2); margin-bottom: var(--space-3);">
      <div>
        <span class="eyebrow">Sequência de estudo</span>
        <h2 style="margin-top:4px;">Continue assim 🌊</h2>
      </div>
      <span class="streak-pill" id="streakPill">🔥 0 dias seguidos</span>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <span class="num" id="statPercentual">0%</span>
        <span class="label">de acertos no geral</span>
      </div>
      <div class="stat">
        <span class="num" id="statRespondidas">0</span>
        <span class="label">questões respondidas</span>
      </div>
    </div>

    <h2 style="margin-top: var(--space-3);">Desempenho por assunto</h2>
    <div id="listaAssuntos"></div>

    <a href="diagnostico.html" class="btn btn-ghost" id="btnRefazer" style="margin-top: var(--space-3); display:inline-block; text-align:center; text-decoration:none;">
      Praticar mais questões
    </a>
  </div>
</main>

<div class="badge-mock" id="badgeMock">modo simulado</div>

<script src="js/api.js"></script>
<script src="js/evolucao.js"></script>
</body>
</html>
